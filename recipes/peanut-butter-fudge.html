    <h1>Peanut Butter Fudge</h1>
    <img src="https://www.allrecipes.com/thmb/QPQtM1-BHyGiVs_tAlVe4IoCmhI=/750x0/filters:no_upscale():max_bytes(150000):strip_icc():format(webp)/Easy-Two-Ingredient-Peanut-Butter-Fudge-2000-b77a2f7bb7f0440282d26123282734e8.jpg" alt="Peanut butter fudge">
    <h2>Ingredients</h2>
    <ul>
        <li>Creamy Peanut butter</li>
        <li>Cream cheese frosting</li>
    </ul>
    <h2>Steps</h2>
    <ol>
        <li>Combine the ingredients in a bowl.</li>
        <li>Microwave for 30 seconds, stir, then microwave again.</li>
        <li>Pour mixture into a prepared baking pan and chill until set.</li>
    </ol>
